apiVersion: v1
kind: Secret
metadata:
  name: visionbridge-secrets
  namespace: '{{ .Release.Namespace }}'
type: Opaque
data:
  REASONING_API_KEY: '{{ .Values.olaresEnv.REASONING_API_KEY | default "local" | b64enc }}'
  VISION_API_KEY: '{{ .Values.olaresEnv.VISION_API_KEY | default "local" | b64enc }}'
  BRIDGE_API_KEYS: '{{ .Values.olaresEnv.BRIDGE_API_KEYS | default "" | b64enc }}'
