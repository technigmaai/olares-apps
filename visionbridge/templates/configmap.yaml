apiVersion: v1
kind: ConfigMap
metadata:
  name: visionbridge-config
  namespace: '{{ .Release.Namespace }}'
data:
  REASONING_BASE_URL: '{{ .Values.olaresEnv.REASONING_BASE_URL | default "http://localhost:1234/v1" }}'
  REASONING_MODEL: '{{ .Values.olaresEnv.REASONING_MODEL | default "local-model" }}'
  VISION_BASE_URL: '{{ .Values.olaresEnv.VISION_BASE_URL | default "http://localhost:11434/v1" }}'
  VISION_MODEL: '{{ .Values.olaresEnv.VISION_MODEL | default "llava:13b" }}'
  BRIDGE_MODEL_NAME: '{{ .Values.olaresEnv.BRIDGE_MODEL_NAME | default "visionbridge" }}'
  MAX_VISION_CALLS: '{{ .Values.olaresEnv.MAX_VISION_CALLS | default "8" }}'
  REQUEST_TIMEOUT_SECONDS: '{{ .Values.olaresEnv.REQUEST_TIMEOUT_SECONDS | default "120" }}'
  ALLOW_FILE_URLS: '{{ .Values.olaresEnv.ALLOW_FILE_URLS | default "false" }}'
  ALLOW_PRIVATE_URLS: '{{ .Values.olaresEnv.ALLOW_PRIVATE_URLS | default "false" }}'
  MAX_IMAGE_BYTES: '{{ .Values.olaresEnv.MAX_IMAGE_BYTES | default "20971520" }}'
  MAX_IMAGES_PER_REQUEST: '{{ .Values.olaresEnv.MAX_IMAGES_PER_REQUEST | default "16" }}'
  TOOL_MODE: '{{ .Values.olaresEnv.TOOL_MODE | default "auto" }}'
  BACKEND_MAX_RETRIES: '{{ .Values.olaresEnv.BACKEND_MAX_RETRIES | default "2" }}'
  LOG_JSON: '{{ .Values.olaresEnv.LOG_JSON | default "false" }}'
  SCENE_PRIMING: '{{ .Values.olaresEnv.SCENE_PRIMING | default "true" }}'
  ENABLE_TRACES: '{{ .Values.olaresEnv.ENABLE_TRACES | default "true" }}'
  IMAGE_CACHE_ENTRIES: '{{ .Values.olaresEnv.IMAGE_CACHE_ENTRIES | default "64" }}'
  EXTRA_MODELS: '{{ .Values.olaresEnv.EXTRA_MODELS | default "" }}'
  EXTRA_MODELS_FILE: '{{ .Values.olaresEnv.EXTRA_MODELS_FILE | default "" }}'
